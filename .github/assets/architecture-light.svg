<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="836" viewBox="0 0 1200 836" role="img" aria-labelledby="title desc"><title id="title">Hiero Enterprise JS architecture</title><desc id="desc">An application uses enterprise-core to send signed transactions to Hiero consensus nodes over gRPC, and enterprise-mirror to read history from the mirror node REST API. Consensus nodes stream records to the mirror node.</desc><defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.3" fill="#e3e1d6"/>
  </pattern>
  <linearGradient id="coreHead" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#992350"/><stop offset="1" stop-color="#b81a56"/>
  </linearGradient>
  <linearGradient id="mirrorHead" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3a0a1e"/><stop offset="1" stop-color="#6d1338"/>
  </linearGradient>
  <linearGradient id="net" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#24000f"/><stop offset="1" stop-color="#3a0a1e"/>
  </linearGradient>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
    <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#b81a56"/>
  </marker>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#6d1338"/>
  </marker>
</defs><rect width="1200" height="836" fill="#faf9f5"/><rect width="1200" height="836" fill="url(#dots)"/><rect x="40" y="36" width="1120" height="104" rx="18" fill="#ffffff" stroke="#e5e4d7" filter="url(#shadow)"/><text x="68" y="74" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2" font-weight="600" fill="#b81a56">YOUR APPLICATION</text><text x="68" y="100" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#1e1e1e">Script · worker · API server</text><text x="68" y="123" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#5f5f5f">Create the services once at startup, share them, close the context on shutdown.</text><rect x="700" y="72" width="168.20000000000002" height="28" rx="14" fill="#f3f2ec" stroke="#e5e4d7"/><text x="784.1" y="90.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1e1e1e">new HieroContext()</text><rect x="880.2" y="72" width="215.60000000000002" height="28" rx="14" fill="#f3f2ec" stroke="#e5e4d7"/><text x="988.0" y="90.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1e1e1e">createMirrorNodeClient()</text><path d="M300 140 V184" stroke="#b81a56" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M900 140 V184" stroke="#6d1338" stroke-width="2.2" fill="none" marker-end="url(#arrow2)"/><text x="312" y="167" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#5f5f5f">writes</text><text x="912" y="167" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#5f5f5f">reads</text><rect x="40" y="190" width="550" height="400" rx="18" fill="#ffffff" stroke="#e5e4d7" filter="url(#shadow)"/><path d="M40 208 a18 18 0 0 1 18 -18 H572 a18 18 0 0 1 18 18 V254 H40 z" fill="url(#coreHead)"/><text x="66" y="220" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#ffffff">@hiero-hackers/enterprise-core</text><text x="66" y="241" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" letter-spacing="1.2" fill="#fde7ef">WRITE SIDE · SIGNED TRANSACTIONS · NEEDS AN OPERATOR</text><rect x="62" y="274" width="506" height="66" rx="12" fill="#fbeef3" stroke="#f2cfdc"/><text x="80" y="301" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="600" fill="#8a1d47">HieroContext</text><text x="80" y="323" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#5f5f5f">network · operator key (kept private) · SDK client · transaction listeners</text><text x="66" y="364" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" letter-spacing="1.6" font-weight="600" fill="#5f5f5f">SERVICES</text><rect x="62" y="376" width="118" height="28" rx="14" fill="#ffffff" stroke="#f2cfdc"/><text x="121.0" y="394.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a1d47">Account</text><rect x="190" y="376" width="118" height="28" rx="14" fill="#ffffff" stroke="#f2cfdc"/><text x="249.0" y="394.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a1d47">Token</text><rect x="318" y="376" width="118" height="28" rx="14" fill="#ffffff" stroke="#f2cfdc"/><text x="377.0" y="394.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a1d47">Topic</text><rect x="446" y="376" width="118" height="28" rx="14" fill="#ffffff" stroke="#f2cfdc"/><text x="505.0" y="394.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a1d47">File</text><rect x="62" y="414" width="118" height="28" rx="14" fill="#ffffff" stroke="#f2cfdc"/><text x="121.0" y="432.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a1d47">Contract</text><rect x="190" y="414" width="118" height="28" rx="14" fill="#ffffff" stroke="#f2cfdc"/><text x="249.0" y="432.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a1d47">Schedule</text><rect x="318" y="414" width="118" height="28" rx="14" fill="#ffffff" stroke="#f2cfdc"/><text x="377.0" y="432.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a1d47">Network</text><text x="66" y="476" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" letter-spacing="1.6" font-weight="600" fill="#5f5f5f">EVERY OPERATION</text><rect x="62" y="488" width="88" height="34" rx="9" fill="#b81a56" stroke="#b81a56"/><text x="106.0" y="510" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#ffffff">validate</text><path d="M152 505 h10" stroke="#5f5f5f" stroke-width="1.6" marker-end="url(#arrow2)"/><rect x="164" y="488" width="88" height="34" rx="9" fill="#ffffff" stroke="#e5e4d7"/><text x="208.0" y="510" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1e1e1e">build</text><path d="M254 505 h10" stroke="#5f5f5f" stroke-width="1.6" marker-end="url(#arrow2)"/><rect x="266" y="488" width="88" height="34" rx="9" fill="#ffffff" stroke="#e5e4d7"/><text x="310.0" y="510" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1e1e1e">sign</text><path d="M356 505 h10" stroke="#5f5f5f" stroke-width="1.6" marker-end="url(#arrow2)"/><rect x="368" y="488" width="88" height="34" rx="9" fill="#ffffff" stroke="#e5e4d7"/><text x="412.0" y="510" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1e1e1e">submit</text><path d="M458 505 h10" stroke="#5f5f5f" stroke-width="1.6" marker-end="url(#arrow2)"/><rect x="470" y="488" width="88" height="34" rx="9" fill="#ffffff" stroke="#e5e4d7"/><text x="514.0" y="510" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1e1e1e">receipt</text><text x="66" y="546" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#5f5f5f">Bad input stops at <tspan font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#8a1d47">INPUT_INVALID</tspan> before any fee is paid;</text><text x="66" y="565" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#5f5f5f">every failure surfaces as a typed <tspan font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#8a1d47">HieroError</tspan>.</text><rect x="610" y="190" width="550" height="400" rx="18" fill="#ffffff" stroke="#e5e4d7" filter="url(#shadow)"/><path d="M610 208 a18 18 0 0 1 18 -18 H1142 a18 18 0 0 1 18 18 V254 H610 z" fill="url(#mirrorHead)"/><text x="636" y="220" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="600" fill="#ffffff">@hiero-hackers/enterprise-mirror</text><text x="636" y="241" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" letter-spacing="1.2" fill="#f1dbe4">READ SIDE · ZERO DEPENDENCIES · NO KEYS</text><text x="636" y="286" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" letter-spacing="1.6" font-weight="600" fill="#5f5f5f">REPOSITORIES</text><rect x="632" y="298" width="118" height="28" rx="14" fill="#f3f2ec" stroke="#e2e0d5"/><text x="691.0" y="316.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3a0a1e">Account</text><rect x="760" y="298" width="118" height="28" rx="14" fill="#f3f2ec" stroke="#e2e0d5"/><text x="819.0" y="316.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3a0a1e">Token</text><rect x="888" y="298" width="118" height="28" rx="14" fill="#f3f2ec" stroke="#e2e0d5"/><text x="947.0" y="316.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3a0a1e">Nft</text><rect x="1016" y="298" width="118" height="28" rx="14" fill="#f3f2ec" stroke="#e2e0d5"/><text x="1075.0" y="316.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3a0a1e">Topic</text><rect x="632" y="336" width="118" height="28" rx="14" fill="#f3f2ec" stroke="#e2e0d5"/><text x="691.0" y="354.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3a0a1e">Transaction</text><rect x="760" y="336" width="118" height="28" rx="14" fill="#f3f2ec" stroke="#e2e0d5"/><text x="819.0" y="354.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3a0a1e">Contract</text><rect x="888" y="336" width="118" height="28" rx="14" fill="#f3f2ec" stroke="#e2e0d5"/><text x="947.0" y="354.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3a0a1e">Block</text><rect x="1016" y="336" width="118" height="28" rx="14" fill="#f3f2ec" stroke="#e2e0d5"/><text x="1075.0" y="354.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3a0a1e">Schedule</text><rect x="632" y="374" width="118" height="28" rx="14" fill="#f3f2ec" stroke="#e2e0d5"/><text x="691.0" y="392.5" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3a0a1e">Network</text><rect x="632" y="426" width="506" height="66" rx="12" fill="#f3f2ec" stroke="#e2e0d5"/><text x="650" y="453" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="600" fill="#3a0a1e">MirrorNodeClient</text><text x="650" y="475" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#5f5f5f">rate limiting · retries · lossless numbers · typed pages</text><text x="636" y="518" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#5f5f5f">Every list returns a <tspan font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#3a0a1e">Page</tspan> with <tspan font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#3a0a1e">next()</tspan>; <tspan font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#3a0a1e">collectAll</tspan> and</text><text x="636" y="537" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#5f5f5f"><tspan font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#3a0a1e">paginate</tspan> drain or stream any listing.</text><text x="636" y="562" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#5f5f5f">Unit helpers convert tinybar ⇄ ℏ, token decimals and consensus timestamps.</text><path d="M300 590 V664" stroke="#b81a56" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="312" y="624" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#5f5f5f">gRPC · signed · fees in ℏ</text><path d="M900 590 V664" stroke="#6d1338" stroke-width="2.2" fill="none" marker-end="url(#arrow2)"/><text x="912" y="624" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#5f5f5f">HTTPS REST · free</text><path d="M520 590 C 560 640, 700 640, 760 664" stroke="#6d1338" stroke-width="1.6" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow2)"/><text x="602" y="612" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#5f5f5f">balances (SDK)</text><rect x="40" y="670" width="1120" height="136" rx="18" fill="url(#net)"/><text x="68" y="702" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2" font-weight="600" fill="#f08fb1">HIERO NETWORK</text><text x="68" y="724" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e5e4d7" opacity="0.8">mainnet · testnet · previewnet · local</text><rect x="150" y="736" width="300" height="54" rx="11" fill="#3a0a1e" stroke="#6d1338"/><text x="168" y="758" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#ffffff">Consensus nodes</text><text x="168" y="778" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e5e4d7" opacity="0.75">order and execute transactions</text><rect x="750" y="736" width="300" height="54" rx="11" fill="#3a0a1e" stroke="#6d1338"/><text x="768" y="758" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#ffffff">Mirror node</text><text x="768" y="778" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#e5e4d7" opacity="0.75">indexes history, serves /api/v1</text><path d="M458 763 H742" stroke="#f08fb1" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" fill="none"/><path d="M732 757 L744 763 L732 769" stroke="#f08fb1" stroke-width="2" fill="none" stroke-linecap="round"/><text x="600" y="754" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#e5e4d7" opacity="0.85">record stream</text></svg>
